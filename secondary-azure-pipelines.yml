trigger: none

pr:
- main

pool:
  name: NetCore-Public
  demands:
  - ImageOverride -equals build.azurelinux.3.amd64.open

steps:
- task: DotNetCoreCLI@2
  inputs:
    command: build
    projects: '**\*Tests.csproj'
- task: VSTest@2
  inputs:
    testSelector: testAssemblies
    testAssemblyVer2: |
      **\SecondaryTests.dll
      !**\obj\**
    searchFolder: '$(System.DefaultWorkingDirectory)'
