trigger: none

pr:
- main

pool:
  name: NetCore-Public
  demands:
  - ImageOverride -equals build.azurelinux.3.amd64.open

steps:
- task: UseDotNet@2
  displayName: Install .NET SDK
  inputs:
    packageType: sdk
    useGlobalJson: true

- task: DotNetCoreCLI@2
  displayName: Build test Projects
  inputs:
    command: build
    projects: '**/*Tests.csproj'

- task: VSTest@2
  inputs:
    testSelector: testAssemblies
    testAssemblyVer2: |
      **\SecondaryTests.dll
      !**\obj\**
    searchFolder: $(System.DefaultWorkingDirectory)
