trigger: none

pr:
  branches:
    include:
    - main
  paths:
    include:
    - '*'
    exclude:
    - '**/*.md'

parameters:
- name: scenarioTestResult
  type: string
  default: KnownIssue
  values:
  - Fail
  - KnownIssue
  - Pass

pool:
  name: NetCore-Public
  demands:
  - ImageOverride -equals build.azurelinux.3.amd64.open

jobs:
- template: /eng/templates/helix-test-job.yml
  parameters:
    jobName: ScenarioHelixTest
    displayName: Scenario Helix test
    correlationPayloadDir: myresult123456-scenario
    resultContent: ${{ parameters.scenarioTestResult }}