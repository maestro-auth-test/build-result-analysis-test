trigger: none

pr:
  branches:
    include:
    - fixtures/rerun-known-issue

pool:
  name: NetCore-Public
  demands:
  - ImageOverride -equals build.azurelinux.3.amd64.open

jobs:
- job: RerunScenario
  displayName: Rerun scenario
  steps:
  # Scenario tests replace the placeholder with a unique error so a known issue can match it.
  - script: |
      echo "##vso[task.logissue type=error]Build Insights rerun scenario failure 1fdcd388e4534bde91ea156ecb7e81fe"
      exit 1
    displayName: Fail with scenario error