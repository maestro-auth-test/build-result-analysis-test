trigger: none

pr:
  branches:
    include:
    - main
  paths:
    include:
    - '*'
    exclude:
    - '**/*.md'

pool:
  name: NetCore-Public
  demands:
  - ImageOverride -equals build.azurelinux.3.amd64.open

jobs:
- job: ScenarioRetryTest
  displayName: Scenario retry test
  timeoutInMinutes: 45
  steps:
  - task: UseDotNet@2
    displayName: Install .NET SDK
    inputs:
      packageType: sdk
      useGlobalJson: true
  - task: DotNetCoreCLI@2
    displayName: Run retry scenario test
    inputs:
      command: test
      projects: src/BuildResultAnalysisTests/BuildResultAnalysisTests.csproj
      arguments: --settings $(Build.SourcesDirectory)/eng/scenario-tests.runsettings
    env:
      SCENARIO_TEST_ATTEMPT: $(System.JobAttempt)
      DOTNET_ROLL_FORWARD: Major